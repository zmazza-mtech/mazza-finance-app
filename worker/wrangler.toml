# Mazza Finance — single Worker: static SPA assets + /api/v1 Hono app.
# See docs/superpowers/specs/2026-08-17-cloudflare-native-replatform.md

name = "mazza-finance"
main = "src/index.ts"
compatibility_date = "2025-09-06"

# The Vite build. Requests that match a static file are served from the CDN;
# /api/* always reaches the Worker first.
[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "mazza-finance"
# Placeholder until `wrangler d1 create mazza-finance` is run at cutover.
database_id = "00000000-0000-0000-0000-000000000000"

# Secrets (set via `wrangler secret put`, never committed):
#   ENCRYPTION_KEY     — 64-char hex master key for SimpleFIN access URLs
#   CLERK_SECRET_KEY   — Phase 2
