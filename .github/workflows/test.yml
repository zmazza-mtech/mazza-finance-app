name: test

# Runs on every branch, not only on pull requests: work here lands as pushed
# branches more often than as pull requests, and a suite that only runs on a
# pull request would leave most commits unverified. The pull_request trigger is
# what makes the check requirable on `main`.
#
# A branch that has a pull request open therefore gets two runs. That is the
# cost of covering both, and on a public repository the minutes are free.
on:
  push:
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches `FROM node:20-alpine` in backend/Dockerfile. The PRD pins versions
  # (§9); CI running a different major than production defeats the point.
  NODE_VERSION: '20'

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # The integration tests need real Postgres — the project forbids mock
      # modes. Version matches docker-compose.yml.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mazza_test
        # 55432 on the host, the same port docker-compose.test.yml publishes,
        # so the connection string is identical to the local one.
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test -d mazza_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    env:
      # tests/globalSetup.ts skips Docker entirely when this is set and migrates
      # the instance it points at, which is this service container.
      TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:55432/mazza_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Typecheck and build
        working-directory: backend
        run: npm run build

      - name: Test
        working-directory: backend
        run: npm test

  frontend:
    name: frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      # `npm run build` is `tsc && vite build`, so this is the typecheck too.
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The E2E suite is slow and builds container images. Running it against a
    # commit whose unit tests already fail tells nobody anything new.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # playwright.config.ts brings the stack in docker-compose.e2e.yml up and
      # takes it down again, so there is no preamble here. The stack seeds its
      # own fixtures and never reads the SimpleFIN secret.
      - name: Test
        working-directory: frontend
        run: npm run e2e

      - name: Upload trace and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
